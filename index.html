
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexPilot 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <h2>✦ NexPilot</h2>
      <p class="version">VERSION 2.0</p>

      <button onclick="newChat()">+ New Chat</button>

      <div class="sidebar-label">YOUR AI</div>
      <div class="nav-item active">✦ AI Assistant</div>
      <div class="nav-item">🧠 Memory</div>
      <div class="nav-item">📁 Projects</div>
      <div class="nav-item">⚙ Settings</div>

      <div class="status">
        <span class="status-dot"></span>
        AI SYSTEM READY
      </div>
    </aside>

    <main class="main">
      <header>
        <div>
          <h3>NexPilot AI</h3>
          <span>YOUR PERSONAL INTELLIGENCE</span>
        </div>
        <div class="avatar">N</div>
      </header>

      <section id="chat" class="chat">
        <div class="welcome">
          <div class="logo">✦</div>
          <h1>Welcome to NexPilot.</h1>
          <p>Your ideas. Your projects. Your AI.</p>
          <div class="suggestions">
            <button onclick="suggest('Help me build a website')">Build a website</button>
            <button onclick="suggest('Help me learn programming')">Learn programming</button>
            <button onclick="suggest('Help me start a business')">Start a business</button>
          </div>
        </div>
      </section>

      <div class="input-area">
        <div class="input-box">
          <textarea id="prompt" placeholder="Ask NexPilot anything..."
            rows="1"></textarea>
          <button id="sendButton" onclick="sendMessage()">↑</button>
        </div>
        <p> NEXPILOT 2.0 · AI CAN MAKE MISTAKES</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
